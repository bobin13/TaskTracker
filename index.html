<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" id="theme-color" content="#f5f6fa" />
    <title>Taskflow — Your tasks, in focus</title>
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("taskflow-theme");
        } catch {}
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #f5f6fa;
        --surface: #fff;
        --surface-muted: #f8f9fc;
        --text: #202235;
        --muted: #85899c;
        --border: #eaebf1;
        --accent: #6858df;
        --accent-soft: #efedff;
        --accent-strong: #6858df;
        --accent-strong-hover: #5949ce;
        --success: #36a77a;
        --timer: #e8541e;
        --danger: #d34e61;
        --check-border: #c9cbd6;
        --shadow: 0 16px 48px rgb(34 35 65 / 8%);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #171821;
        --surface: #22242f;
        --surface-muted: #292b37;
        --text: #f1f1f7;
        --muted: #a0a2b3;
        --border: #363846;
        --accent: #a59aff;
        --accent-soft: #343148;
        --accent-strong: #6f61e6;
        --accent-strong-hover: #8174f2;
        --success: #63c99c;
        --timer: #ff8a5c;
        --danger: #f07a8a;
        --check-border: #4f5263;
        --shadow: 0 16px 48px rgb(0 0 0 / 20%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: background-color 180ms ease, color 180ms ease;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .topbar {
        height: 72px;
        padding: 0 max(24px, calc((100% - 1080px) / 2));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        color: inherit;
        text-decoration: none;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.5px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        color: white;
        background: var(--accent);
        border-radius: 11px;
      }

      .brand-mark svg {
        width: 19px;
        height: 19px;
      }

      .topbar-right,
      .task-count {
        display: flex;
        align-items: center;
      }

      .topbar-right {
        gap: 22px;
      }

      .task-count {
        gap: 9px;
        color: var(--muted);
        font-size: 13px;
      }

      .count-number {
        min-width: 27px;
        height: 27px;
        padding: 0 7px;
        display: grid;
        place-items: center;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 9px;
        font-size: 12px;
        font-weight: 750;
      }

      .theme-button {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        transition: transform 150ms ease, background-color 180ms ease;
      }

      .theme-button:hover {
        transform: translateY(-1px);
      }

      .theme-button svg {
        width: 18px;
        height: 18px;
      }

      main {
        width: min(100% - 40px, 680px);
        margin: 64px auto 80px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 40px);
        letter-spacing: -1.7px;
        line-height: 1.15;
      }

      .subtitle {
        margin: 11px 0 30px;
        color: var(--muted);
        font-size: 15px;
      }

      .task-panel {
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .task-form {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px;
        border-bottom: 1px solid var(--border);
      }

      .task-input,
      .duration-input {
        width: 100%;
        min-width: 0;
        height: 46px;
        padding: 0 14px;
        color: var(--text);
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 11px;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .task-input::placeholder,
      .duration-input::placeholder {
        color: var(--muted);
      }

      .task-input:focus,
      .duration-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
      }

      .duration-field {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }

      .duration-input {
        width: 66px;
        padding: 0 9px;
        text-align: center;
      }

      .add-button {
        flex: 0 0 auto;
        height: 46px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: 7px;
        color: #fff;
        background: var(--accent-strong);
        border: 0;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 150ms ease, transform 150ms ease;
      }

      .add-button:hover {
        background: var(--accent-strong-hover);
        transform: translateY(-1px);
      }

      .add-button svg {
        width: 16px;
        height: 16px;
      }

      .list-heading {
        min-height: 55px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .clear-button {
        padding: 6px 0 6px 8px;
        color: var(--accent);
        background: transparent;
        border: 0;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      .clear-button:hover {
        text-decoration: underline;
      }

      .task-list {
        margin: 0;
        padding: 0 20px 10px;
        list-style: none;
      }

      .task-item {
        position: relative;
        min-height: 68px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid var(--border);
      }

      /* Remaining-time bar: shrinks and shifts from green to red as time runs out. */
      .task-progress {
        /* OKLCH passes through amber/orange between green and red instead of muddy brown. */
        --progress-color: color-mix(in oklch, var(--danger) var(--elapsed-pct, 0%), var(--success));
        position: absolute;
        top: -2px;
        left: 0;
        width: calc(var(--remaining, 1) * 100%);
        height: 3px;
        background: var(--progress-color);
        border-radius: 3px;
        pointer-events: none;
        transition: width 1s linear, background-color 1s linear, opacity 200ms ease;
      }

      .task-item.paused .task-progress {
        opacity: 0.45;
      }

      .task-item.expired .task-progress {
        width: 100%;
        animation: progress-pulse 1.4s ease-in-out infinite;
      }

      .task-item.completed .task-progress {
        display: none;
      }

      @keyframes progress-pulse {
        50% {
          opacity: 0.35;
        }
      }

      .task-check {
        position: relative;
        flex: 0 0 19px;
        width: 19px;
        height: 19px;
        margin: 0;
        appearance: none;
        background: var(--surface);
        border: 1.5px solid var(--check-border);
        border-radius: 6px;
        cursor: pointer;
      }

      .task-check:checked {
        background: var(--success);
        border-color: var(--success);
      }

      .task-check:checked::after {
        position: absolute;
        top: 1px;
        left: 5px;
        width: 5px;
        height: 9px;
        border: solid white;
        border-width: 0 2px 2px 0;
        content: "";
        transform: rotate(45deg);
      }

      .task-text {
        display: block;
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 16px;
        line-height: 1.45;
      }

      .task-content {
        flex: 1;
        min-width: 0;
        padding: 10px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .timer-controls {
        min-height: 24px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      .timer-time {
        color: var(--timer);
        font-size: 18px;
        font-weight: 700;
      }

      .timer-time.expired {
        color: var(--danger);
      }

      .timer-button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .edit-input {
        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 0 10px;
        color: var(--text);
        background: var(--surface-muted);
        border: 1px solid var(--accent);
        border-radius: 8px;
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
        font-size: 16px;
      }

      .storage-warning {
        margin: -14px 0 18px;
        padding: 10px 14px;
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 10%, transparent);
        border-radius: 10px;
        font-size: 13px;
      }

      .timer-time.finished {
        color: var(--success);
      }

      .timer-button {
        padding: 4px 8px;
        color: var(--muted);
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }

      .timer-button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .task-item.completed .task-text {
        color: var(--muted);
        text-decoration: line-through;
      }

      .icon-button {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: grid;
        place-items: center;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        opacity: 0;
        transition: color 150ms ease, background-color 150ms ease, opacity 150ms ease;
      }

      .task-item:hover .icon-button,
      .task-item:focus-within .icon-button {
        opacity: 1;
      }

      .edit-button:hover {
        color: var(--accent);
        background: var(--accent-soft);
      }

      .delete-button:hover {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 10%, transparent);
      }

      .icon-button svg {
        width: 16px;
        height: 16px;
      }

      .empty-state {
        padding: 36px 16px 42px;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      .empty-icon {
        width: 42px;
        height: 42px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 14px;
      }

      .empty-icon svg {
        width: 21px;
        height: 21px;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 5px;
        color: var(--text);
        font-size: 14px;
      }

      @media (max-width: 520px) {
        .topbar {
          height: 64px;
          padding: 0 18px;
        }

        .topbar-right {
          gap: 13px;
        }

        .task-count {
          gap: 7px;
          font-size: 12px;
        }

        main {
          width: min(100% - 28px, 680px);
          margin-top: 44px;
        }

        .task-form {
          padding: 13px;
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
        }

        .task-input {
          grid-column: 1 / -1;
        }

        .duration-field {
          justify-self: start;
        }

        .add-button {
          padding: 0 13px;
        }

        .task-item {
          gap: 9px;
        }

        .task-content {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
        }

        .timer-controls {
          gap: 6px;
          align-self: flex-end;
        }

        .add-label {
          display: none;
        }

        .task-list {
          padding-right: 14px;
          padding-left: 14px;
        }

        .icon-button {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Taskflow home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="m6 12 4 4L18 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>Taskflow</span>
      </a>
      <div class="topbar-right">
        <div class="task-count" aria-live="polite">
          <span class="count-number" id="task-count">0</span>
          <span id="count-label">tasks</span>
        </div>
        <button class="theme-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <p class="eyebrow">Your personal workspace</p>
      <h1>Make today count.</h1>
      <p class="subtitle">A little progress adds up. What’s on your list?</p>
      <p class="storage-warning" id="storage-warning" role="status" hidden>
        Your browser is blocking storage, so changes won’t be kept after you close this tab.
      </p>

      <section class="task-panel" aria-label="Task list">
        <form class="task-form" id="task-form">
          <input class="task-input" id="task-input" type="text" maxlength="160" placeholder="Add a task to get started..." aria-label="New task" autocomplete="off" />
          <label class="duration-field" for="duration-input">
            <span>Timer</span>
            <input class="duration-input" id="duration-input" type="number" min="1" max="1440" step="1" value="60" aria-label="Timer duration in minutes" required />
            <span>min</span>
          </label>
          <button class="add-button" type="submit">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="add-label">Add task</span>
          </button>
        </form>
        <div class="list-heading">
          <span>YOUR TASKS</span>
          <button class="clear-button" id="clear-completed" type="button" hidden>Clear completed</button>
        </div>
        <ul class="task-list" id="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <script>
      const taskForm = document.querySelector("#task-form");
      const taskInput = document.querySelector("#task-input");
      const durationInput = document.querySelector("#duration-input");
      const taskList = document.querySelector("#task-list");
      const taskCount = document.querySelector("#task-count");
      const countLabel = document.querySelector("#count-label");
      const clearCompletedButton = document.querySelector("#clear-completed");
      const themeToggle = document.querySelector("#theme-toggle");
      const themeIcon = document.querySelector("#theme-icon");
      const themeColorMeta = document.querySelector("#theme-color");
      const storageWarning = document.querySelector("#storage-warning");
      const storageKeys = { tasks: "taskflow-tasks", theme: "taskflow-theme" };
      const defaultDurationMs = 60 * 60 * 1000;
      const defaultTitle = document.title;
      let editingId = null;

      // ---------- Storage (never throws) ----------

      function storageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function storageSet(key, value) {
        try {
          localStorage.setItem(key, value);
          storageWarning.hidden = true;
          return true;
        } catch {
          storageWarning.hidden = false;
          return false;
        }
      }

      function readStoredTasks() {
        try {
          const value = JSON.parse(storageGet(storageKeys.tasks) || "[]");
          return Array.isArray(value)
            ? value
                .filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
                .map((task) => {
                  const durationMs = Number.isFinite(task.durationMs) && task.durationMs > 0 ? task.durationMs : defaultDurationMs;
                  const hasTimer = Number.isFinite(task.durationMs) && Number.isFinite(task.remainingMs);
                  const endsAt = Number.isFinite(task.endsAt) ? task.endsAt : null;
                  const remainingMs = hasTimer
                    ? endsAt === null ? Math.max(0, task.remainingMs) : Math.max(0, endsAt - Date.now())
                    : durationMs;
                  return {
                    ...task,
                    durationMs,
                    remainingMs,
                    endsAt: task.completed || remainingMs === 0 ? null : hasTimer ? endsAt : Date.now() + remainingMs,
                  };
                })
            : [];
        } catch {
          return [];
        }
      }

      let tasks = readStoredTasks();

      function saveTasks() {
        storageSet(storageKeys.tasks, JSON.stringify(tasks));
      }

      saveTasks();

      // ---------- Time helpers ----------

      function remainingTime(task) {
        return task.endsAt === null ? task.remainingMs : Math.max(0, task.endsAt - Date.now());
      }

      function formatTime(milliseconds) {
        const totalSeconds = Math.ceil(milliseconds / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const twoDigits = (value) => String(value).padStart(2, "0");
        return hours > 0 ? `${hours}:${twoDigits(minutes)}:${twoDigits(seconds)}` : `${twoDigits(minutes)}:${twoDigits(seconds)}`;
      }

      // ---------- Time's-up alerts (sound + notification) ----------

      let audioContext = null;

      function unlockAudio() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        try {
          audioContext ??= new AudioCtx();
          if (audioContext.state === "suspended") audioContext.resume();
        } catch {}
      }

      function playChime() {
        if (!audioContext) return;
        try {
          const start = audioContext.currentTime;
          [880, 880, 1046.5].forEach((frequency, index) => {
            const at = start + index * 0.25;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.exponentialRampToValueAtTime(0.25, at + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(at);
            oscillator.stop(at + 0.24);
          });
        } catch {}
      }

      function requestNotificationPermission() {
        if (!("Notification" in window) || Notification.permission !== "default") return;
        try {
          Notification.requestPermission().catch(() => {});
        } catch {}
      }

      function alertTimeUp(expiredTasks) {
        playChime();
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        for (const task of expiredTasks) {
          try {
            new Notification("Time's up", { body: task.text, tag: task.id });
          } catch {}
        }
      }

      // Browsers need a user gesture before audio can play.
      document.addEventListener("pointerdown", unlockAudio);
      document.addEventListener("keydown", unlockAudio);

      // ---------- Ticking ----------

      function updateTitle() {
        const active = tasks.filter((task) => !task.completed);
        const running = active.filter((task) => task.endsAt !== null).sort((a, b) => a.endsAt - b.endsAt);
        if (running.length > 0) {
          const [next] = running;
          const more = running.length > 1 ? ` (+${running.length - 1})` : "";
          document.title = `⏱ ${formatTime(remainingTime(next))} · ${next.text}${more}`;
          return;
        }
        const expired = active.find((task) => task.remainingMs === 0);
        document.title = expired ? `⏰ Time's up · ${expired.text}` : defaultTitle;
      }

      function updateTimerDisplays() {
        for (const item of taskList.querySelectorAll(".task-item")) {
          const task = tasks.find((entry) => entry.id === item.dataset.taskId);
          if (!task) continue;

          const left = remainingTime(task);
          const fraction = task.durationMs > 0 ? Math.min(1, Math.max(0, left / task.durationMs)) : 0;
          item.style.setProperty("--remaining", fraction.toFixed(4));
          item.style.setProperty("--elapsed-pct", `${((1 - fraction) * 100).toFixed(1)}%`);
          item.classList.toggle("paused", !task.completed && task.endsAt === null && left > 0);
          item.classList.toggle("expired", !task.completed && left === 0);

          const time = item.querySelector(".timer-time");
          const toggle = item.querySelector(".timer-toggle");
          if (time) {
            time.textContent = task.completed ? "Completed" : left === 0 ? "Time's up" : formatTime(left);
            time.classList.toggle("expired", !task.completed && left === 0);
            time.classList.toggle("finished", task.completed);
          }
          if (toggle) {
            const label = task.endsAt === null ? "Resume" : "Pause";
            toggle.textContent = label;
            toggle.disabled = task.completed || left === 0;
            toggle.setAttribute("aria-label", `${label} timer: ${task.text}`);
          }
        }
      }

      function tick() {
        const now = Date.now();
        const expired = [];
        for (const task of tasks) {
          if (!task.completed && task.endsAt !== null && task.endsAt <= now) {
            task.remainingMs = 0;
            task.endsAt = null;
            expired.push(task);
          }
        }
        if (expired.length > 0) {
          saveTasks();
          alertTimeUp(expired);
        }
        updateTimerDisplays();
        updateTitle();
      }

      // Timers in hidden tabs can be slowed to once a minute; a worker's timer
      // isn't, so use one to keep the tab-title countdown smooth.
      function startTicker() {
        try {
          const source = "setInterval(() => postMessage(0), 1000);";
          const worker = new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
          worker.onmessage = tick;
          worker.onerror = () => {
            worker.terminate();
            window.setInterval(tick, 1000);
          };
        } catch {
          window.setInterval(tick, 1000);
        }
      }

      // ---------- Timer actions ----------

      function toggleTimer(task) {
        if (task.completed) return;
        if (task.endsAt !== null) {
          task.remainingMs = remainingTime(task);
          task.endsAt = null;
        } else if (task.remainingMs > 0) {
          task.endsAt = Date.now() + task.remainingMs;
        }
        saveTasks();
        tick();
      }

      function resetTimer(task) {
        if (task.completed) return;
        task.remainingMs = task.durationMs;
        task.endsAt = Date.now() + task.durationMs;
        saveTasks();
        tick();
      }

      // ---------- Rendering ----------

      function createIcon(path) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("fill", "none");
        svg.setAttribute("aria-hidden", "true");
        const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
        shape.setAttribute("d", path);
        shape.setAttribute("stroke", "currentColor");
        shape.setAttribute("stroke-width", "1.8");
        shape.setAttribute("stroke-linecap", "round");
        shape.setAttribute("stroke-linejoin", "round");
        svg.append(shape);
        return svg;
      }

      function applyLabels(item, task) {
        item.querySelector(".task-check")?.setAttribute("aria-label", `${task.completed ? "Mark as not done" : "Complete"}: ${task.text}`);
        item.querySelector(".timer-reset")?.setAttribute("aria-label", `Reset timer: ${task.text}`);
        item.querySelector(".edit-button")?.setAttribute("aria-label", `Edit task: ${task.text}`);
        item.querySelector(".delete-button")?.setAttribute("aria-label", `Delete task: ${task.text}`);
      }

      function createTaskText(task) {
        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;
        text.title = "Double-click to edit";
        text.addEventListener("dblclick", () => startEditing(task));
        return text;
      }

      function startEditing(task) {
        editingId = task.id;
        renderTasks();
      }

      function createEditInput(task, item) {
        const input = document.createElement("input");
        input.className = "edit-input";
        input.type = "text";
        input.maxLength = 160;
        input.value = task.text;
        input.setAttribute("aria-label", `Edit task: ${task.text}`);

        let finished = false;
        const finish = (save, viaKeyboard) => {
          if (finished) return;
          finished = true;
          const value = input.value.trim();
          if (save && value && value !== task.text) {
            task.text = value;
            saveTasks();
          }
          editingId = null;
          // Swap in place so a click elsewhere (which caused the blur) still lands.
          input.replaceWith(createTaskText(task));
          applyLabels(item, task);
          updateTitle();
          if (viaKeyboard) item.querySelector(".edit-button")?.focus();
        };

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            finish(true, true);
          } else if (event.key === "Escape") {
            event.preventDefault();
            finish(false, true);
          }
        });
        input.addEventListener("blur", () => finish(true, false));
        return input;
      }

      function renderTasks() {
        taskList.replaceChildren();
        const activeCount = tasks.filter((task) => !task.completed).length;
        taskCount.textContent = String(activeCount);
        countLabel.textContent = activeCount === 1 ? "task left" : "tasks left";
        clearCompletedButton.hidden = !tasks.some((task) => task.completed);

        if (tasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.append(createIcon("M8 12.5 10.5 15 16 9.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"));
          const heading = document.createElement("strong");
          heading.textContent = "Your list is clear";
          const message = document.createElement("span");
          message.textContent = "Add a task above and make it happen.";
          empty.append(icon, heading, message);
          taskList.append(empty);
          updateTitle();
          return;
        }

        let editInput = null;

        for (const task of tasks) {
          const item = document.createElement("li");
          item.className = `task-item${task.completed ? " completed" : ""}`;
          item.dataset.taskId = task.id;

          const progress = document.createElement("span");
          progress.className = "task-progress";
          progress.setAttribute("aria-hidden", "true");
          item.append(progress);

          const checkbox = document.createElement("input");
          checkbox.className = "task-check";
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
              // Remember whether the timer was running so un-checking restores it.
              task.resumeOnUncheck = task.endsAt !== null;
              if (task.endsAt !== null) {
                task.remainingMs = remainingTime(task);
                task.endsAt = null;
              }
              task.completed = true;
            } else {
              task.completed = false;
              if (task.resumeOnUncheck && task.remainingMs > 0) task.endsAt = Date.now() + task.remainingMs;
              delete task.resumeOnUncheck;
            }
            saveTasks();
            renderTasks();
          });

          const content = document.createElement("div");
          content.className = "task-content";
          let textElement;
          if (task.id === editingId) {
            editInput = createEditInput(task, item);
            textElement = editInput;
          } else {
            textElement = createTaskText(task);
          }

          const timerControls = document.createElement("div");
          timerControls.className = "timer-controls";
          const timer = document.createElement("span");
          timer.className = "timer-time";
          timerControls.append(timer);

          if (!task.completed) {
            const toggle = document.createElement("button");
            toggle.className = "timer-button timer-toggle";
            toggle.type = "button";
            toggle.addEventListener("click", () => toggleTimer(task));

            const reset = document.createElement("button");
            reset.className = "timer-button timer-reset";
            reset.type = "button";
            reset.textContent = "Reset";
            reset.addEventListener("click", () => resetTimer(task));
            timerControls.append(toggle, reset);
          }

          const edit = document.createElement("button");
          edit.className = "icon-button edit-button";
          edit.type = "button";
          edit.append(createIcon("M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"));
          edit.addEventListener("click", () => startEditing(task));

          const remove = document.createElement("button");
          remove.className = "icon-button delete-button";
          remove.type = "button";
          remove.append(createIcon("M4 7h16M10 11v6M14 11v6M5 7l1 14h12l1-14M9 7V4h6v3"));
          remove.addEventListener("click", () => {
            tasks = tasks.filter((entry) => entry.id !== task.id);
            saveTasks();
            renderTasks();
          });

          timerControls.append(edit, remove);
          content.append(textElement, timerControls);
          item.append(checkbox, content);
          applyLabels(item, task);
          taskList.append(item);
        }

        updateTimerDisplays();
        updateTitle();
        if (editInput) {
          editInput.focus();
          editInput.select();
        }
      }

      // ---------- Form + bulk actions ----------

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) {
          taskInput.focus();
          return;
        }
        const durationMinutes = Number(durationInput.value);
        if (!Number.isInteger(durationMinutes) || durationMinutes < 1 || durationMinutes > 1440) {
          durationInput.focus();
          return;
        }
        unlockAudio();
        requestNotificationPermission();
        const durationMs = durationMinutes * 60 * 1000;
        tasks.unshift({
          id: crypto.randomUUID(),
          text,
          completed: false,
          durationMs,
          remainingMs: durationMs,
          endsAt: Date.now() + durationMs,
        });
        saveTasks();
        renderTasks();
        taskInput.value = "";
        taskInput.focus();
      });

      clearCompletedButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        renderTasks();
      });

      // ---------- Theme ----------

      const darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      function savedTheme() {
        const theme = storageGet(storageKeys.theme);
        return theme === "dark" || theme === "light" ? theme : null;
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        const isDark = theme === "dark";
        themeToggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} mode`);
        themeToggle.title = `Switch to ${isDark ? "light" : "dark"} mode`;
        themeIcon.innerHTML = isDark
          ? '<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
          : '<path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
        themeColorMeta.content = getComputedStyle(document.documentElement).getPropertyValue("--page").trim();
      }

      applyTheme(savedTheme() ?? (darkQuery?.matches ? "dark" : "light"));

      // Follow the OS setting until the user picks a theme explicitly.
      darkQuery?.addEventListener?.("change", (event) => {
        if (!savedTheme()) applyTheme(event.matches ? "dark" : "light");
      });

      themeToggle.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        storageSet(storageKeys.theme, next);
      });

      // ---------- Start ----------

      renderTasks();
      startTicker();
      document.addEventListener("visibilitychange", tick);
    </script>
  </body>
</html>
